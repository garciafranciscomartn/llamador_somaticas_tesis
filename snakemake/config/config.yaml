# ============================================================
# Pairwise Somatic Calling Pipeline – Configuration
# ============================================================

# ------------------------------------------------------------------
# Sample sheet
# Required columns: sample_id  bam_path
# Optional column:  group   (used to restrict the frequency filter
#                             denominator to cross-group pairs only)
#
# Example rows:
#   sample_id                              bam_path             group
#   SampleA    /path/to/SampleA.bam    EBV+
#   SampleB    /path/to/SampleB.bam    EBV-
# ------------------------------------------------------------------
samples: "snakemake/config/samples.tsv"

# ------------------------------------------------------------------
# Reference files (hg38)
# ------------------------------------------------------------------
reference:
  genome:            "/home/andres/herramientas/refs/francisco/Homo_sapiens_assembly38.fasta"
  dict:              "/home/andres/herramientas/refs/francisco/Homo_sapiens_assembly38.dict"
  germline_resource: "/home/andres/herramientas/refs/francisco/somatic-hg38_af-only-gnomad.hg38.vcf.gz"
  panel_of_normals:  "/home/andres/herramientas/refs/francisco/somatic-hg38_1000g_pon.hg38.vcf.gz"
  bed:               "/home/andres/herramientas/refs/francisco/bedfile.bed"

# ------------------------------------------------------------------
# Mutect2
# ------------------------------------------------------------------
mutect2:
  extra: "--af-of-alleles-not-in-resource 0.0000025"
  intervals: "/home/andres/herramientas/refs/francisco/bedfile.interval_list"

# ------------------------------------------------------------------
# VarScan2
# ------------------------------------------------------------------
varscan2:
  min_coverage:    10
  min_var_freq:    0.01
  p_value:         0.99
  somatic_p_value: 0.05

# ------------------------------------------------------------------
# VarDict
# ------------------------------------------------------------------
vardict:
  min_allele_freq: 0.01

# ------------------------------------------------------------------
# Strelka2 / Manta paths
# ------------------------------------------------------------------
strelka2:
  bin:       "/home/andres/herramientas/strelka-2.9.10.centos6_x86_64/bin"
  # run_manta: set to true to generate indel candidates with Manta first.
  # False = run Strelka2 directly (faster, used in the original analysis).
  run_manta: false
  manta_bin: "/home/andres/herramientas/manta-1.6.0.centos6_x86_64/bin"

# ------------------------------------------------------------------
# Consensus calling
# min_callers: how many callers must agree to keep a variant
# ------------------------------------------------------------------
consensus:
  callers:
    - mutect2
    - varscan2
    - vardict
    - strelka2
  min_callers: 2

# ------------------------------------------------------------------
# Frequency filter
# Variants are counted across all cross-group pairwise comparisons.
# Only pairs where the pseudo-normal belongs to a DIFFERENT group than
# the tumor count toward the denominator (cross-group logic).
# min_frequency: keep variants found in >= this fraction of cross-group pairs.
# 0.75 = 75% of cross-group pseudo-normals must call the variant.
# ------------------------------------------------------------------
frequency_filter:
  min_frequency: 0.75

# ------------------------------------------------------------------
# Resource allocation
# ------------------------------------------------------------------
resources:
  mutect2:
    mem_mb:  20000
    threads: 8
  pileup:
    mem_mb:  8000
    threads: 4
  filter:
    mem_mb:  8000
    threads: 4
  vardict:
    threads: 4
  strelka2:
    threads: 4
  default:
    mem_mb:  8000
    threads: 4

# ------------------------------------------------------------------
# Output directory
# ------------------------------------------------------------------
outdir: "results"
